
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Details - CarePilot AI</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="layout">

    <aside class="sidebar">
        <h2>CarePilot<span>AI</span></h2>
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a class="active" href="patient.html">Patient Details</a>
            <a href="chatbot.html">AI Assistant</a>
            <a href="upload.html">Document Upload</a>
            <a href="analysis.html">Medical Analysis</a>
            <a href="workflow.html">AI Workflow</a>
            <a href="profile.html">Profile</a>
        </nav>
    </aside>

    <main class="main-content">

        <header class="topbar">
            <div>
                <h1>Patient Details</h1>
                <p>Manage patient information</p>
            </div>
        </header>

        <section class="content-card">
            <h2>Patient Information Form</h2>

            <form id="patientForm">

                <div class="form-grid">

                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="name" required>
                    </div>

                    <div class="form-group">
                        <label>Patient ID</label>
                        <input type="text" id="patientId">
                    </div>

                    <div class="form-group">
                        <label>Age</label>
                        <input type="number" id="age" min="0" max="120">
                    </div>

                    <div class="form-group">
                        <label>Gender</label>
                        <select id="gender">
                            <option value="">Select Gender</option>
                            <option>Male</option>
                            <option>Female</option>
                            <option>Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Blood Group</label>
                        <select id="blood">
                            <option value="">Select</option>
                            <option>A+</option>
                            <option>A-</option>
                            <option>B+</option>
                            <option>B-</option>
                            <option>O+</option>
                            <option>O-</option>
                            <option>AB+</option>
                            <option>AB-</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Contact Number</label>
                        <input type="tel" id="phone">
                    </div>

                </div>

                <div class="form-group">
                    <label>Symptoms</label>
                    <textarea id="symptoms" rows="4"></textarea>
                </div>

                <div class="form-group">
                    <label>Medical History</label>
                    <textarea id="history" rows="4"></textarea>
                </div>

                <button type="submit" class="btn">
                    Save Patient Details
                </button>

            </form>
        </section>

        <section class="content-card">
            <h2>Patient Preview</h2>
            <div id="patientPreview">
                No patient details saved yet.
            </div>
        </section>

    </main>
</div>

<script src="js/common.js"></script>
<script src="js/patient.js"></script>
</body>
</html>
